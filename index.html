
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Nido | Escáner ISBN</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f2ed;
      color: #283b36;
      text-align: center;
      padding: 24px 16px;
    }
    main {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    button {
      padding: 14px 20px;
      background: #283b36;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    #lector {
      margin: 20px auto;
    }
    #mensaje {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>EL NIDO</h1>
    <h2>Escáner ISBN</h2>
    <p>Coloca el código de barras del libro frente a la cámara.</p>
    <button id="iniciar" onclick="iniciarEscaner()">Activar cámara</button>
    <div id="lector"></div>
    <p id="mensaje">Esperando para escanear...</p>
  </main>

  <script>
    let escaner;

    function iniciarEscaner() {
      const mensaje = document.getElementById("mensaje");
      const boton = document.getElementById("iniciar");

      if (typeof Html5Qrcode === "undefined") {
        mensaje.textContent = "No se pudo cargar el lector.";
        return;
      }

      boton.disabled = true;
      escaner = new Html5Qrcode("lector");

      escaner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 280, height: 130 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13
          ]
        },
        function(isbn) {
          mensaje.textContent = "ISBN leído: " + isbn;

          escaner.stop().then(function() {
            if (window.opener) {
              window.opener.postMessage(
                { tipo: "EL_NIDO_ISBN", isbn: isbn },
                "*"
              );
              mensaje.textContent += " Enviando a El Nido...";
              window.close();
            } else {
              mensaje.textContent +=
                " Abre este lector desde la aplicación El Nido.";
              boton.disabled = false;
            }
          });
        },
        function() {}
      ).catch(function(error) {
        mensaje.textContent = "No se pudo activar la cámara: " + error;
        boton.disabled = false;
      });
    }
  </script>
</body>
</html>
