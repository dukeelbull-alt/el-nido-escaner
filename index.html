
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Nido | Escáner ISBN</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f2ed;
      color: #283b36;
      text-align: center;
      padding: 24px 16px;
    }
   main {
  width: 100%;
  max-width: 700px;
  box-sizing: border-box;
  margin: auto;
  background: white;
  padding: 16px;
  border-radius: 16px;
}
    button {
      padding: 14px 20px;
      background: #283b36;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    #contenedorCamara {
  width: 100%;
  max-width: 700px;
  margin: 20px auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

#botonFlash {
  width: 100%;
  max-width: 280px;
  background: #283b36;
}

#botonFlash:disabled {
  opacity: 0.55;
}
 #reader {
  width: 100%;
  max-width: 400px;
  margin: 16px auto;
  border: 0 !important;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  object-fit: cover;
  border-radius: 12px;
}
    #mensaje {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>EL NIDO</h1>
    <h2>Escáner ISBN</h2>
    <p>Coloca el código de barras del libro frente a la cámara.</p>
    <button id="iniciar" onclick="iniciarEscaner()">Activar cámara</button>
    <div id="contenedorCamara">
  <div id="reader"></div>

  <button id="botonFlash" type="button" onclick="alternarFlash()">
    ⚡ Activar flash
  </button>
</div>
    <p id="mensaje">Esperando para escanear...</p>
  </main>

  <script>
    let escaner;
let flashActivo = false;
let flashDisponible = false;

    function iniciarEscaner() {
      const mensaje = document.getElementById("mensaje");
      const boton = document.getElementById("iniciar");

      if (typeof Html5Qrcode === "undefined") {
        mensaje.textContent = "No se pudo cargar el lector.";
        return;
      }

      boton.disabled = true;
      escaner = new Html5Qrcode("reader");

      escaner.start(
  { facingMode: "environment" },
  {
    fps: 15,
    qrbox: { width: 280, height: 100 },
   aspectRatio: 1.777,
videoConstraints: {
  facingMode: "environment",
  width: { ideal: 1920 },
  height: { ideal: 1080 },
  aspectRatio: { ideal: 1.777 }
},
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13
    ]
  },
        function(isbn) {
          mensaje.textContent = "ISBN leído: " + isbn;

          escaner.stop().then(function() {
            if (window.opener) {
              window.opener.postMessage(
                { tipo: "EL_NIDO_ISBN", isbn: isbn },
                "*"
              );
              mensaje.textContent += " Enviando a El Nido...";
              window.close();
            } else {
              mensaje.textContent +=
                " Abre este lector desde la aplicación El Nido.";
              boton.disabled = false;
            }
          });
        },
        function() {}
           ).then(function() {
        
        try {
          const capacidades = escaner.getRunningTrackCameraCapabilities();
          flashDisponible = capacidades.torch === true;

          const botonFlash = document.getElementById("botonFlash");
          botonFlash.disabled = !flashDisponible;

          if (!flashDisponible) {
            botonFlash.textContent = "Flash no disponible";
          }
        } catch (error) {
          flashDisponible = false;
          document.getElementById("botonFlash").disabled = true;
        }
      }).catch(function(error) {
        mensaje.textContent = "No se pudo activar la cámara: " + error;
        boton.disabled = false;
      });
    }
    async function alternarFlash() {
  const botonFlash = document.getElementById("botonFlash");
  const mensaje = document.getElementById("mensaje");

  if (!escaner || !flashDisponible) {
    mensaje.textContent = "El flash no está disponible en este dispositivo.";
    return;
  }

  try {
    await escaner.applyVideoConstraints({
      advanced: [{ torch: !flashActivo }]
    });

    flashActivo = !flashActivo;

    botonFlash.textContent = flashActivo
      ? "⚡ Apagar flash"
      : "⚡ Activar flash";

  } catch (error) {
    mensaje.textContent = "No se pudo controlar el flash.";
  }
}
  </script>
</body>
</html>
